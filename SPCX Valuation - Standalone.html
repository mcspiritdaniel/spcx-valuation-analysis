document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n    body { background: #fff; }\n    :root {\n      --navy:       oklch(0.22 0.120 258);\n      --navy-mid:   oklch(0.38 0.080 258);\n      --navy-light: oklch(0.55 0.045 258);\n      --gold:       oklch(0.76 0.13 82);\n      --border:     oklch(0.90 0.015 258);\n      --border-mid: oklch(0.80 0.025 258);\n      --bg-subtle:  oklch(0.975 0.006 258);\n      --bg-gold:    oklch(0.96 0.018 82);\n      --pos:        oklch(0.38 0.140 162);\n      --neg:        oklch(0.44 0.148 24);\n      --cat-label:  oklch(0.72 0.018 258);\n    }\n    input[type=range] {\n      -webkit-appearance: none; appearance: none;\n      width: 100%; height: 2px;\n      background: var(--border); border-radius: 1px;\n      cursor: pointer; margin: 4px 0 0; outline: none;\n    }\n    input[type=range]::-webkit-slider-thumb {\n      -webkit-appearance: none;\n      width: 10px; height: 10px; border-radius: 50%;\n      background: var(--gold); cursor: pointer;\n    }\n    input[type=range]::-moz-range-thumb {\n      width: 10px; height: 10px; border-radius: 50%;\n      background: var(--gold); border: none; cursor: pointer;\n    }\n    .reset-btn:hover { color: var(--navy) !important; border-color: var(--navy-mid) !important; }\n    a { color: inherit; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height:3px;background:var(--gold);\"><\u002Fdiv>\n\n<nav style=\"display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:52px;border-bottom:1px solid var(--border);\">\n  <div style=\"display:flex;align-items:center;gap:16px;\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;letter-spacing:0.14em;color:var(--navy);\">SPCX<\u002Fspan>\n    <span style=\"width:1px;height:14px;background:var(--border-mid);\"><\u002Fspan>\n    <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:var(--navy-light);\">Space Exploration Technologies Corp.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:20px;\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--navy-light);\">Valuation Analysis<\u002Fspan>\n    <button class=\"reset-btn\" onclick=\"{{ reset_to_defaults }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--navy-light);background:none;border:1px solid var(--border-mid);padding:4px 10px;cursor:pointer;transition:color 0.15s,border-color 0.15s;\">Reset to model defaults<\u002Fbutton>\n    <a href=\"https://www.linkedin.com/in/danmcspirit\" target=\"_blank\" style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);text-decoration:none;border-bottom:1px solid var(--border-mid);padding-bottom:1px;letter-spacing:0.03em;\">Dan McSpirit ↗<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- Row 1: Hero + Description -->\n<div style=\"display:flex;border-bottom:1px solid var(--border);min-height:196px;\">\n  <div style=\"width:55%;padding:32px 40px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--navy-light);\">Equity Value · Per Share<\u002Fdiv>\n    <div>\n      <div style=\"font-family:'Playfair Display',serif;font-size:86px;font-weight:700;line-height:1;color:var(--navy);letter-spacing:-0.025em;\">{{ implied_price }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:12px;margin-top:10px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:{{ upside_color }};\">{{ upside_label }}<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy-light);\">vs. {{ current_price }} <span style=\"font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--cat-label);\">current price<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--navy-light);\">All figures USD million unless noted · Not investment advice<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"width:45%;padding:32px 40px;display:flex;flex-direction:column;justify-content:space-between;\">\n    <div>\n      <div style=\"font-family:'Playfair Display',serif;font-size:26px;font-weight:500;color:var(--navy);line-height:1.2;margin-bottom:18px;\">Model Methodology<\u002Fdiv>\n      <p style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;line-height:1.65;color:var(--navy-mid);max-width:520px;text-wrap:pretty;\">A sum-of-the-parts valuation — Space, Connectivity, AI, and Expansion are each valued independently, at their own cost of capital, rather than treating SpaceX as a single business with a single discount rate. Wherever possible, growth is grounded in what's actually disclosed; where it isn't — Expansion, the one segment representing products that don't exist yet — it's priced as a convex, option-like payoff across Bear/Base/Bull scenarios rather than a single guess.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.10em;text-transform:uppercase;color:var(--navy-light);padding-top:28px;\">Model defaults are starting values only · Inputs have varying degrees of impact<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Valuation & Market Inputs -->\n<div style=\"border-bottom:1px solid var(--border);\">\n  <div style=\"padding:12px 40px 0;\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--navy-light);\">Valuation &amp; Market Inputs<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;padding-right:40px;\">\n\n    <!-- Col 1: Costs of Capital + Market Comps -->\n    <div style=\"width:256px;flex-shrink:0;padding:16px 28px 20px 40px;border-right:1px solid var(--border);\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--navy);margin-bottom:14px;\">Costs of Capital<\u002Fdiv>\n\n      <div style=\"margin-bottom:9px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Risk-free rate<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ rf_rate_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0.035\" max=\"0.05\" step=\"0.0005\" value=\"{{ rf_rate }}\" onchange=\"{{ set_rf_rate }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:9px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Equity risk premium<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ erp_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0.04\" max=\"0.06\" step=\"0.0005\" value=\"{{ erp }}\" onchange=\"{{ set_erp }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:9px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Pre-tax cost of debt<\u002Fspan>\n "0.08\" step=\"0.005\" value=\"{{ exp_rp }}\" onchange=\"{{ set_exp_rp }}\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:170px 1fr 1fr 1fr 1fr;padding:8px 28px;border-bottom:1px solid var(--border);align-items:center;\">\n        <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Terminal Growth<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);\">{{ space_tg_val }}<\u002Fspan>\n          <input type=\"range\" min=\"0.015\" max=\"0.035\" step=\"0.001\" value=\"{{ space_tg }}\" onchange=\"{{ set_space_tg }}\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);\">{{ conn_tg_val }}<\u002Fspan>\n          <input type=\"range\" min=\"0.015\" max=\"0.035\" step=\"0.001\" value=\"{{ conn_tg }}\" onchange=\"{{ set_conn_tg }}\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);\">{{ ai_tg_val }}<\u002Fspan>\n          <input type=\"range\" min=\"0.015\" max=\"0.035\" step=\"0.001\" value=\"{{ ai_tg }}\" onchange=\"{{ set_ai_tg }}\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);\">{{ exp_tg_val }}<\u002Fspan>\n          <input type=\"range\" min=\"0.015\" max=\"0.035\" step=\"0.001\" value=\"{{ exp_tg }}\" onchange=\"{{ set_exp_tg }}\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:170px 1fr 1fr 1fr 1fr;padding:8px 28px;border-bottom:1px solid var(--border);align-items:center;\">\n        <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-light);\">Terminal Reinvest. Rate<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy-mid);\">{{ space_trr_val }}<\u002Fspan>\n          <input type=\"range\" min=\"0.05\" max=\"0.30\" step=\"0.01\" value=\"{{ space_trr }}\" onchange=\"{{ set_space_trr }}\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy-mid);\">{{ conn_trr_val }}<\u002Fspan>\n          <input type=\"range\" min=\"0.05\" max=\"0.30\" step=\"0.01\" value=\"{{ conn_trr }}\" onchange=\"{{ set_conn_trr }}\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy-mid);\">{{ ai_trr_val }}<\u002Fspan>\n          <input type=\"range\" min=\"0.05\" max=\"0.30\" step=\"0.01\" value=\"{{ ai_trr }}\" onchange=\"{{ set_ai_trr }}\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;padding:0 6px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy-mid);\">{{ exp_trr_val }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--cat-label);margin-top:3px;\">g ÷ WACC<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:170px 1fr 1fr 1fr 1fr;padding:9px 28px;background:var(--bg-subtle);align-items:center;\">\n        <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:600;color:var(--navy);\">Resulting WACC<\u002Fspan>\n        <div style=\"text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--navy);\">{{ space_wacc_val }}<\u002Fdiv>\n        <div style=\"text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--navy);\">{{ conn_wacc_val }}<\u002Fdiv>\n        <div style=\"text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--navy);\">{{ ai_wacc_val }}<\u002Fdiv>\n        <div style=\"text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--navy);\">{{ exp_wacc_val }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:20px;\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Right: ROIC vs. WACC Spread Diagnostic -->\n    <div style=\"flex:1;padding:16px 28px 20px;overflow:hidden;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--navy);margin-bottom:12px;\">ROIC vs. WACC · Spread<\u002Fdiv>\n      <table style=\"width:100%;border-collapse:collapse;\">\n        <thead>\n          <tr style=\"border-bottom:1px solid var(--border);\">\n            <th style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--navy);text-align:left;padding:0 0 6px 0;width:120px;\">Segment<\u002Fth>\n            <th style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--navy-light);text-align:right;padding:0 24px 6px 0;\">ROIC<sub style=\"font-size:8px;\">ss<\u002Fsub><\u002Fth>\n            <th style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--navy-light);text-align:right;padding:0 24px 6px 0;\">WACC<\u002Fth>\n            <th style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--navy-light);text-align:right;padding:0 0 6px 0;\">Spread<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr style=\"border-bottom:1px solid var(--border);\">\n            <td style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--navy-mid);padding:8px 0;\">Space<\u002Ftd>\n            <td style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cat-label);text-align:right;padding:8px 24px 8px 0;\">pending<\u002Ftd>\n            <td style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);text-align:right;padding:8px 24px 8px 0;\">{{ space_wacc_val }}<\u002Ftd>\n            <td style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cat-label);text-align:right;padding:8px 0;\">pending<\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"border-bottom:1px solid var(--border);\">\n            <td style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--navy-mid);padding:8px 0;\">Connectivity<\u002Ftd>\n            <td style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cat-label);text-align:right;padding:8px 24px 8px 0;\">pending<\u002Ftd>\n            <td style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);text-align:right;padding:8px 24px 8px 0;\">{{ conn_wacc_val }}<\u002Ftd>\n            <td style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cat-label);text-align:right;padding:8px 0;\">pending<\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"border-bottom:1px solid var(--border);\">\n            <td style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--navy-mid);padding:8px 0;\">AI<\u002Ftd>\n            <td style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cat-label);text-align:right;padding:8px 24px 8px 0;\">pending<\u002Ftd>\n            <td style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);text-align:right;padding:8px 24px 8px 0;\">{{ ai_wacc_val }}<\u002Ftd>\n            <td style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cat-label);text-align:right;padding:8px 0;\">pending<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--navy-mid);padding:8px 0;vertical-align:top;\">Expansion<\u002Ftd>\n            <td colspan=\"3\" style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;line-height:1.55;color:var(--cat-label);text-align:left;padding:8px 0 8px 24px;\">Expansion's reinvestment rate is defined as g ÷ WACC, not independently sourced — so ROIC<sub style=\"font-size:9px;\">ss<\u002Fsub> equals WACC by construction. Spread here is a structural identity, not a forecast.<br><span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.08em;color:var(--navy-light);margin-top:12px;display:inline-block;\">ss = steady state<\u002Fspan><\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Row 2: Segment Cards -->\n<div style=\"padding:0 40px;border-bottom:1px solid var(--border);\">\n  <div style=\"padding:12px 0 0;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--navy-light);margin-bottom:0;\">Segment Analysis<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0;\">\n\n    <!-- SPACE -->\n    <div style=\"border-right:1px solid var(--border);padding:18px 28px 20px 0;display:flex;flex-direction:column;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--navy);margin-bottom:1px;\">Space<\u002Fdiv>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:500;color:var(--navy);text-align:right;line-height:1;letter-spacing:-0.02em;\">{{ space_ev }}<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--navy-light);text-align:right;margin-bottom:14px;\">Enterprise value<\u002Fdiv>\n      <p style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;line-height:1.65;color:var(--navy-mid);text-wrap:pretty;margin-bottom:16px;\">Space combines a launch-volume S-curve — growth that accelerates, then tapers as the business approaches its ceiling — with a steadily rising price per launch, and margins that improve in step with how fast the business actually scales rather than on a fixed timeline. Because Space's revenue leans heavily on government launch contracts — the most stable, least market-sensitive part of the business — it carries the most conservative risk profile of the four segments, closer to a traditional aerospace contractor than a typical growth story.<\u002Fp>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cat-label);margin-top:16px;margin-bottom:8px;\">External launch growth<\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Annual cadence target<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ space_cadence_target_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"30\" max=\"300\" step=\"5\" value=\"{{ space_cadence_target }}\" onchange=\"{{ set_space_cadence_target }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\" -align:right;margin-bottom:14px;\">Enterprise value<\u002Fdiv>\n      <p style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;line-height:1.65;color:var(--navy-mid);text-wrap:pretty;margin-bottom:16px;\">Connectivity uses the same S-curve growth pattern as Space — subscribers ramping toward a ceiling — paired with per-subscriber revenue that gradually declines as the base matures, and a hardware-revenue layer that fades as fewer subscribers are buying their first terminal each year. It's treated as the most proven, lowest-risk segment of the four, reflecting the fastest subscriber scale-up of any satellite internet provider to date — and it's the single largest driver of the company's total value.<\u002Fp>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cat-label);margin-top:16px;margin-bottom:8px;\">Subscription service growth<\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Subscriber potential<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ conn_sub_potential_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"15\" max=\"150\" step=\"1\" value=\"{{ conn_sub_potential }}\" onchange=\"{{ set_conn_sub_potential }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Market penetration speed<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ conn_penetration_speed_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\ nn_wc_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"-0.1\" max=\"0.1\" step=\"0.005\" value=\"{{ conn_wc }}\" onchange=\"{{ set_conn_wc }}\">\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- AI -->\n    <div style=\"border-right:1px solid var(--border);padding:18px 28px 20px 28px;display:flex;flex-direction:column;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--navy);margin-bottom:1px;\">AI<\u002Fdiv>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:500;color:var(--navy);text-align:right;line-height:1;letter-spacing:-0.02em;\">{{ ai_ev }}<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--navy-light);text-align:right;margin-bottom:6px;\">Enterprise value<\u002Fdiv>\n      <sc-if value=\"{{ ai_ev_is_negative }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;line-height:1.5;color:var(--neg);border:1px solid oklch(0.90 0.04 24);background:oklch(0.98 0.008 24);padding:8px 10px;margin-bottom:10px;\">At these settings, AI's expected returns don't cover its cost of capital — this segment is a net drag on equity value.<\u002Fdiv>\n      <\u002Fsc-if>\n      <p style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;line-height:1.65;color:var(--navy-mid);text-wrap:pretty;margin-bottom:16px;\">AI combines the same S-curve capacity growth used across the other segments with something more concrete: a real split between contracted revenue from named, disclosed compute agreements and merchant revenue for whatever capacity isn't already spoken for, so expiring contracts automatically roll into re-priced capacity rather than requiring a separate assumption. It carries the least-proven risk profile of the three real segments, reflecting a competitive field with better-funded, more established rivals.<\u002Fp>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cat-label);margin-top:16px;margin-bottom:8px;\">Megawatt growth<\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Total cluster target<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ ai_cluster_target_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"900\" max=\"5000\" step=\"100\" value=\"{{ ai_cluster_target }}\" onchange=\"{{ set_ai_cluster_target }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Deployment speed<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ ai_deploy_speed_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0.1\" max=\"1.0\" step=\"0.05\" value=\"{{ ai_deploy_speed }}\" onchange=\"{{ set_ai_deploy_speed }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Midpoint year<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ ai_midpoint_year_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"2026\" max=\"2030\" step=\"1\" value=\"{{ ai_midpoint_year }}\" onchange=\"{{ set_ai_midpoint_year }} \u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0.25\" max=\"0.65\" step=\"0.05\" value=\"{{ ai_target_margin }}\" onchange=\"{{ set_ai_target_margin }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Margin ramp speed<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ ai_margin_ramp_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0.0\" max=\"1.0\" step=\"0.05\" value=\"{{ ai_margin_ramp }}\" onchange=\"{{ set_ai_margin_ramp }}\">\n      <\u002Fdiv>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cat-label);margin-top:16px;margin-bottom:8px;\">Capital spending<\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Depreciation rate<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ ai_dep_rate_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0.05\" max=\"0.25\" step=\"0.01\" value=\"{{ ai_dep_rate }}\" onchange=\"{{ set_ai_dep_rate }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Maintenance capex<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ ai_maint_capex_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0.0\" max=\"0.35\" step=\"0.01\" value=\"{{ ai_maint_capex }}\" onchange=\"{{ set_ai_maint_capex }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Data center build cost / MW<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ ai_dc_build_cost_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"10\" max=\"65\" step=\"5\" value=\"{{ ai_dc_build_cost }}\" onchange=\"{{ set_ai_dc_build_cost }}\">\n      <\u002Fdiv>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cat-label);margin-top:16px;margin-bottom:8px;\">Working capital<\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Change in NWC<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ wc_sae_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"-0.1\" max=\"0.1\" step=\"0.005\" value=\"{{ wc_sae }}\" onchange=\"{{ set_wc_sae }}\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--cat-label);margin-top:4px;\">Shared · Space / AI / Expansion<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cat-label);margin-top:16px;margin-bottom:8px;\">Contract risk<\u002Fdiv>\n      <div style=\"margin-bottom:14px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Contract termination risk<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ ai_contract_term_risk_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"0.50\" step=\"0.05\" value=\"{{ ai_contract_term_risk }}\" onchange=\"{{ set_ai_contract_term_risk }}\">\n      <\u002Fdiv>\n\n\n    <\u002Fdiv>\n\n    <!-- EXPANSION -->\n    <div style=\"padding:18px 0 20px 28px;display:flex;flex-direction:column;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--navy);margin-bottom:1px;\">Expansion<\u002Fdiv>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:500;color:var(--navy);text-align:right;line-height:1;letter-spacing:-0.02em;\">{{ exp_ev }}<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--navy-light);text-align:right;margin-bottom:14px;\">Enterprise value<\u002Fdiv>\n      <p style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;line-height:1.65;color:var(--navy-mid);text-wrap:pretty;margin-bottom:16px;\">Expansion values future products that don't exist yet — it only starts contributing once Space, Connectivity, and AI have matured enough to support something built on top of them, weighted toward whichever platform the company is actually investing in most. Rather than a single guess, three scenarios (bearish, base, bullish) are blended into one expected outcome, and growth fades gradually toward a steady pace using a phased-growth approach (H-model) over roughly two decades — reflecting a genuinely long investment horizon, not a near-term forecast.<\u002Fp>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cat-label);margin-top:16px;margin-bottom:8px;\">Segment weighting<\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">Space — catalyst weight<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ exp_space_weight_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"1.0\" step=\"0.05\" value=\"{{ exp_space_weight }}\" onchange=\"{{ set_exp_space_weight }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--navy-mid);\">AI — catalyst weight<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);\">{{ exp_ai_weight_val }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"1.0\" step=\"0.05\" value=\"{{ exp_ai_weight }}\" onchange=\"{{ set_exp_ai_weight }}\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:2px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--cat-label);\">Connectivity — residual<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cat-label);\">{{ exp_conn_weight_val }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cat-label);margin-top:16px;margin-bottom:8px;\">Timing and payoff shape<\u002Fdiv>\n      <div style=\"margin-bottom:8px;\">\n        <div style  s.rf_rate + s.exp_beta   * s.erp + s.exp_rp;\n    const exp_trr_dyn = exp_wacc > 0 ? s.exp_tg / exp_wacc : 0;\n\n    // Segment EVs — static snapshot from Valuation worksheet; connects to calc engine in Cursor build\n    const spaceEV = 71149;\n    const connEV  = 632057;\n    const aiEV    = 149990;\n    const expEV   = 275679;\n    const totalEV = spaceEV + connEV + aiEV + expEV; // 1,128,875 — $1M rounding vs bridge table\n    const upside = (impliedPrice - CURRENT_PRICE) / CURRENT_PRICE * 100;\n\n    return {\n      // Hero\n      implied_price: px(impliedPrice),\n      current_price: px(CURRENT_PRICE),\n      upside_label:  (upside >= 0 ? '+' : '') + upside.toFixed(1) + '%',\n      upside_color:  upside >= 0 ? 'var(--pos)' : 'var(--neg)',\n\n      // Segment outputs\n      ai_ev_is_negative: aiEV < 0,\n      space_per_share: px(spaceEV / SHARES),\n      space_ev:        br(spaceEV),\n      conn_per_share:  px(connEV / SHARES),\n      conn_ev:         br(connEV),\n      ai_per_share:    px(aiEV / SHARES),\n      ai_ev:           br(aiEV),\n      exp_per_share:   px(expEV / SHARES),\n      exp_ev:          br(expEV),\n\n      // V&MI display\n      rf_rate_val:    pct(s.rf_rate),\n      erp_val:        pct(s.erp),\n      rd_val:         pct(s.pretax_rd),\n      anysphere_val:  mult(s.anysphere_ev_sales),\n      space_beta_val: p2(s.space_beta),\n      conn_beta_val:  p2(s.conn_beta),\n      ai_beta_val:    p2(s.ai_beta),\n      exp_beta_val:   p2(s.exp_beta),\n      space_rp_val:   pct(s.space_rp),\n      conn_rp_val:    pct(s.conn_rp),\n      ai_rp_val:      pct(s.ai_rp),\n      exp_rp_val:     pct(s.exp_rp),\n      space_wacc_val: pct(space_wacc),\n      conn_wacc_val:  pct(conn_wacc),\n      ai_wacc_val:    pct(ai_wacc),\n      exp_wacc_val:   pct(exp_wacc),\n      space_tg_val:   pct(s.space_tg),\n      conn_tg_val:    pct(s.conn_tg),\n      ai_tg_val:      pct(s.ai_tg),\n      exp_tg_val:     pct(s.exp_tg),\n      space_trr_val:  pct(s.space_trr),\n      conn_trr_val:   pct(s.conn_trr),\n      ai_trr_val:     pct(s.ai_trr),\n      exp_trr_val:    pct(exp_trr_dyn),\n      wc_sae_val:     pct1(s.wc_sae),\n      conn_wc_val:    pct1(s.conn_wc),\n\n      // V&MI raw\n      rf_rate: s.rf_rate, erp: s.erp, pretax_rd: s.pretax_rd,\n      anysphere_ev_sales: s.anysphere_ev_sales,\n      space_beta: s.space_beta, conn_beta: s.conn_beta, ai_beta: s.ai_beta, exp_beta: s.exp_beta,\n      space_rp: s.space_rp, conn_rp: s.conn_rp, ai_rp: s.ai_rp, exp_rp: s.exp_rp,\n      space_tg: s.space_tg, conn_tg: s.conn_tg, ai_tg: s.ai_tg, exp_tg: s.exp_tg,\n      space_trr: s.space_trr, conn_trr: s.conn_trr, ai_trr: s.ai_trr,\n      wc_sae: s.wc_sae, conn_wc: s.conn_wc,\n\n      // Space display\n      space_cadence_target_val: cnt(s.space_cadence_target),\n      space_ramp_speed_val:     p2(s.space_ramp_speed),\n      space_midpoint_year_val:  yr(s.space_midpoint_year),\n      space_price_start_val:    usdM(s.space_price_start),\n      space_price_end_val:      usdM(s.space_price_end),\n      space_target_margin_val:  pct1(s.space_target_margin),\n      space_margin_ramp_val:    p2(s.space_margin_ramp),\n      space_dep_rate_val:       pct1(s.space_dep_rate),\n      space_maint_capex_val:    pct1(s.space_maint_capex),\n      space_cap_eff_1_5_val:    p1(s.space_cap_eff_1_5),\n      space_cap_eff_6_10_val:   p1(s.space_cap_eff_6_10),\n\n      // Space raw\n      space_cadence_target: s.space_cadence_target, space_ramp_speed: s.space_ramp_speed,\n      space_midpoint_year: s.space_midpoint_year, space_price_start: s.space_price_start,\n      space_price_end: s.space_price_end, space_target_margin: s.space_target_margin,\n      space_margin_ramp: s.space_margin_ramp, space_dep_rate: s.space_dep_rate,\n      space_maint_capex: s.space_maint_capex, space_cap_eff_1_5: s.space_cap_eff_1_5,\n      space_cap_eff_6_10: s.space_cap_eff_6_10,\n\n      // Connectivity display\n      conn_sub_potential_val:    mils(s.conn_sub_potential),\n      conn_penet target: s.ai_cluster_target, ai_deploy_speed: s.ai_deploy_speed,\n      ai_midpoint_year: s.ai_midpoint_year, ai_price_per_mw: s.ai_price_per_mw,\n      ai_price_appreciation: s.ai_price_appreciation, ai_target_margin: s.ai_target_margin,\n      ai_margin_ramp: s.ai_margin_ramp, ai_dep_rate: s.ai_dep_rate,\n      ai_maint_capex: s.ai_maint_capex, ai_dc_build_cost: s.ai_dc_build_cost,\n      ai_contract_term_risk: s.ai_contract_term_risk,\n\n      // Expansion display\n      exp_space_weight_val:       pct1(s.exp_space_weight),\n      exp_ai_weight_val:          pct1(s.exp_ai_weight),\n      exp_conn_weight_val:        pct1(Math.max(0, 1 - s.exp_space_weight - s.exp_ai_weight)),\n      exp_strike_val:             pct1(s.exp_strike),\n      exp_convexity_val:          p1(s.exp_convexity),\n      exp_dep_rate_val:           pct1(s.exp_dep_rate),\n      exp_cap_efficiency_val:     mult(s.exp_cap_efficiency),\n      exp_maint_capex_val:        pct1(s.exp_maint_capex),\n      exp_bear_bull_spread_val:   pct1(s.exp_bear_bull_spread),\n      exp_tail_prob_val:          pct1(s.exp_tail_prob),\n      exp_bull_boost_val:         mult(s.exp_bull_boost),\n      exp_market_potential_val:   '$' + Math.round(s.exp_market_potential / 1000) + 'B',\n      exp_years_to_mature_val:    s.exp_years_to_mature + ' yr',\n\n      // Expansion raw\n      exp_space_weight: s.exp_space_weight, exp_ai_weight: s.exp_ai_weight,\n      exp_strike: s.exp_strike, exp_convexity: s.exp_convexity,\n      exp_dep_rate: s.exp_dep_rate, exp_cap_efficiency: s.exp_cap_efficiency,\n      exp_maint_capex: s.exp_maint_capex, exp_bear_bull_spread: s.exp_bear_bull_spread,\n      exp_tail_prob: s.exp_tail_prob, exp_bull_boost: s.exp_bull_boost,\n      exp_market_potential: s.exp_market_potential, exp_years_to_mature: s.exp_years_to_mature,\n\n      // Output card bridges\n      space_ev_bridge: br(spaceEV), conn_ev_bridge: br(connEV),\n      ai_ev_bridge: br(aiEV), exp_ev_bridge: br(expEV),\n      total_ev_bridge:
